<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🌱 SmartCrop Result</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(to bottom right, #f5fff5, #d8f3d1);
      text-align: center;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 60%;
      margin: 50px auto;
      background: #fff;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    h1 {
      color: #2b7a0b;
      margin-bottom: 10px;
    }
    .score-bar {
      width: 80%;
      height: 25px;
      background: #eee;
      border-radius: 10px;
      margin: 10px auto;
      overflow: hidden;
    }
    .score-fill {
      height: 100%;
      background: linear-gradient(90deg, #2b7a0b, #7ed957);
      text-align: right;
      color: white;
      line-height: 25px;
      padding-right: 10px;
      font-size: 14px;
      border-radius: 10px;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: center;
    }
    th {
      background: #2b7a0b;
      color: white;
    }
    tr:nth-child(even) {
      background: #f4fff3;
    }
    .top-crop {
      background: #d4f5c7 !important;
      font-weight: bold;
    }
    a.button {
      display: inline-block;
      margin-top: 20px;
      background: #2b7a0b;
      color: white;
      padding: 10px 20px;
      border-radius: 8px;
      text-decoration: none;
      transition: 0.3s;
    }
    a.button:hover {
      background: #3fa34d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌿 SmartCrop Recommendation Result</h1>
    <p><b>🧪 Soil Type:</b> {{ soil_name }}</p>
    <p><b>🤖 Suitability Score:</b></p>

    <div class="score-bar">
      <div class="score-fill" style="width: {{ fuzzy_score }}%;">
        {{ fuzzy_score }}%
      </div>
    </div>

    <h3>🌾 Recommended Crops</h3>
    <table>
      <tr>
        <th>Crop Name</th>
        <th>Predicted Yield (tons/hectare)</th>
      </tr>
      {% for crop in recommended_crops %}
        <tr class="{% if loop.first %}top-crop{% endif %}">
          <td>{{ crop.name }}</td>
          <td>{{ crop.predicted_yield }}</td>
        </tr>
      {% endfor %}
    </table>

    <a href="/" class="button">🔙 Back</a>
  </div>
</body>
</html>
