services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crop_zen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - crop_zen_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crop_zen"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/crop_zen
      SECRET_KEY: ${SECRET_KEY:?Set a secure SECRET_KEY before starting docker compose}
      FLASK_ENV: production
      FRONTEND_URL: http://localhost:3000
      LOG_FOLDER: /app/logs
      UPLOAD_FOLDER: /app/uploads
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  crop_zen_postgres:
  backend_uploads:
  backend_logs:
